<style>
/* True North — private compass for conviction & ministry alignment */

:root {
  --ink: #0e111b;
  --ink-2: #151a28;
  --ink-3: #1c2333;
  --line: #27304a;
  --text: #e8eaf2;
  --muted: #98a0bb;
  --gold: #d6a854;
  --gold-dim: #927036;
  --green: #6bbf8a;
  --amber: #e0b061;
  --rust: #d97a63;
  --red: #e0625a;
  --radius: 14px;
  --tap: 44px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.25; font-weight: 600; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75em; }
a { color: var(--gold); }

.muted { color: var(--muted); }
.small { font-size: .85rem; }
.error { color: var(--red); }
.center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */

.shell { display: flex; flex-direction: column; min-height: 100%; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-title { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.topbar-actions { display: flex; gap: 6px; }
.mark { width: 22px; height: 22px; }

.view {
  flex: 1;
  padding: 16px 14px calc(96px + env(safe-area-inset-bottom));
  max-width: 780px; width: 100%; margin: 0 auto;
  outline: none;
}

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--ink) 94%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1 1 0; max-width: 120px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px; min-height: var(--tap);
  background: none; border: 0; color: var(--muted);
  font: inherit; font-size: .68rem; cursor: pointer;
}
.tab svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--gold); }
.tab .badge {
  position: absolute; transform: translate(15px, -4px);
  background: var(--rust); color: #1b0f0b; border-radius: 9px;
  font-size: .6rem; font-weight: 700; padding: 0 5px; line-height: 14px;
}

.warn {
  max-width: 780px; margin: 12px auto 0; padding: 10px 14px;
  border: 1px solid color-mix(in srgb, var(--rust) 55%, var(--line));
  border-radius: 11px; background: color-mix(in srgb, var(--rust) 12%, var(--ink-2));
  color: var(--text); font-size: .85rem;
}

/* ---------- cards & bits ---------- */

.card {
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.card + .card { margin-top: 12px; }
.card-tap {
  display: block; width: 100%;
  padding: 0; border: 0; background: none;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
}
.card.card-tap { padding: 14px; border: 1px solid var(--line); background: var(--ink-2); }
.card.card-tap:active { background: var(--ink-3); }

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; margin: 22px 0 10px;
}
.section-head:first-child { margin-top: 4px; }
.section-head h2 { margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--tap); padding: 0 16px;
  border-radius: 11px; border: 1px solid var(--line);
  background: var(--ink-3); color: var(--text);
  font: inherit; font-weight: 500; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #17120a; font-weight: 600; }
.btn.ghost { background: none; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: .85rem; border-radius: 9px; }

.icon-btn {
  min-height: 34px; padding: 0 10px;
  background: none; border: 1px solid var(--line); border-radius: 9px;
  color: var(--muted); font: inherit; font-size: .8rem; cursor: pointer;
}
.icon-btn:active { background: var(--ink-3); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--ink-3); border: 1px solid var(--line);
  font-size: .74rem; color: var(--muted); white-space: nowrap;
}
.chip.on { background: color-mix(in srgb, var(--gold) 18%, var(--ink-3)); border-color: var(--gold-dim); color: var(--gold); }
.chip button, button.chip { font: inherit; cursor: pointer; }

.pill { font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.lv-aligned { color: var(--green); }
.lv-mostly  { color: #a9cf7f; }
.lv-tension { color: var(--amber); }
.lv-conflict{ color: var(--rust); }
.lv-unknown { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }

.empty {
  border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 22px 16px; text-align: center; color: var(--muted);
}

.list-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.list-item:last-child { border-bottom: 0; }

/* ---------- compass ---------- */

.compass { display: grid; place-items: center; padding: 10px 0 4px; }
.compass svg { width: min(230px, 62vw); height: auto; }
.needle { transition: transform .8s cubic-bezier(.22,.9,.3,1); transform-origin: 100px 100px; }
.compass-read { text-align: center; margin-top: 6px; }
.compass-read .big { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; }

.meter { height: 7px; border-radius: 4px; background: var(--ink-3); overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }

.spark { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
.spark i { display: block; width: 6px; border-radius: 2px; background: var(--gold-dim); }

.domains { display: flex; flex-direction: column; gap: 11px; }
.domain-row { display: block; width: 100%; }
.domain-row .meter { margin-top: 6px; }
.domain-row.domain-alert strong,
.domain-row.domain-alert > .row > span:first-child { color: var(--text); }
.us-line { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }

.tnum { font-variant-numeric: tabular-nums; }
.strong { font-weight: 600; }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.grid { border-collapse: collapse; width: 100%; font-size: .85rem; }
table.grid th, table.grid td { padding: 7px 8px; text-align: right; white-space: nowrap; }
table.grid tbody th { max-width: 9.5rem; overflow: hidden; text-overflow: ellipsis; }
table.grid thead th { font-size: .72rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
table.grid thead th:first-child,
table.grid tbody th { text-align: left; font-weight: 600; color: var(--text); }
table.grid tbody th { position: sticky; left: 0; background: var(--ink-2); }
table.grid tbody tr + tr th, table.grid tbody tr + tr td { border-top: 1px solid var(--line); }
table.grid td.cell-alert { outline: 1px solid var(--rust); outline-offset: -1px; }

/* ---------- forms ---------- */

label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; }

input[type=color] { width: 60px; height: 44px; padding: 4px; background: var(--ink-3); border: 1px solid var(--line); border-radius: 11px; }

input[type=text], input[type=password], input[type=date], input[type=number], select, textarea {
  width: 100%; padding: 11px 12px; min-height: var(--tap);
  background: var(--ink-3); color: var(--text);
  border: 1px solid var(--line); border-radius: 11px;
  font: inherit;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-dim); outline-offset: 1px; }
select { appearance: none; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  flex: 1 1 auto; min-height: 38px; padding: 0 10px;
  background: var(--ink-3); border: 1px solid var(--line); border-radius: 10px;
  color: var(--muted); font: inherit; font-size: .82rem; cursor: pointer;
}
.seg button[aria-pressed=true] {
  background: color-mix(in srgb, var(--gold) 20%, var(--ink-3));
  border-color: var(--gold-dim); color: var(--gold); font-weight: 600;
}

.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; }
.check input[type=checkbox] {
  width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--gold);
}

/* ---------- sheet ---------- */

.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(4,6,12,.66); }
.sheet-panel {
  position: relative; width: 100%; max-width: 640px;
  max-height: 92vh; display: flex; flex-direction: column;
  background: var(--ink-2); border: 1px solid var(--line);
  border-radius: 18px 18px 0 0;
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translateY(14px); opacity: .4; } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 14px 10px; border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; }
.sheet-body { padding: 14px 14px calc(20px + env(safe-area-inset-bottom)); overflow: auto; }
@media (min-width: 700px) {
  .sheet { align-items: center; }
  .sheet-panel { border-radius: 18px; max-height: 86vh; }
}

/* ---------- lock ---------- */

.lock { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--ink); padding: 20px; }
.lock-card { width: 100%; max-width: 320px; text-align: center; }
.lock-mark { width: 62px; height: 62px; margin-bottom: 6px; }
.lock form { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.lock input { text-align: center; letter-spacing: .3em; font-size: 1.1rem; }

/* ---------- toast ---------- */

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom));
  transform: translateX(-50%); z-index: 70;
  background: var(--ink-3); border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 999px; font-size: .88rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>

<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <svg class="lock-mark" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 12 L74 84 L50 70 Z" fill="#d6a854"/>
      <path d="M50 12 L26 84 L50 70 Z" fill="#927036"/>
    </svg>
    <h1>True North</h1>
    <p class="muted" id="lock-hint">Enter your PIN to unlock.</p>
    <form id="lock-form" autocomplete="off">
      <input id="lock-pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN"
             autocomplete="current-password">
      <button class="btn primary" type="submit">Unlock</button>
    </form>
    <p class="error" id="lock-error" hidden></p>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <header class="topbar">
    <div class="topbar-title">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 12 L74 84 L50 70 Z" fill="#d6a854"/>

      view.append(h("div", { class: "card" }, done.slice(0, 12).map(row)));
    }
    view.append(h("button", { class: "btn primary block", style: "margin-top:18px", onClick: () => editAction() }, "Add a follow-up"));
    return view;
  }
  var title6 = "Follow-through";

  // js/app.js
  var VIEWS = { compass: compass_exports, convictions: convictions_exports, plays: plays_exports, log: log_exports, people: people_exports, do: followups_exports };
  var ICONS = {
    compass: '<circle cx="12" cy="12" r="9"/><path d="M15.6 8.4 10.2 10.2 8.4 15.6l5.4-1.8z"/>',
    convictions: '<path d="M6 3h12v18H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8.5 3v18"/>',
    plays: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v-2M12 22.5v-2M3.5 12h-2M22.5 12h-2"/>',
    log: '<path d="M5 3.5h14v17H5z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/>',
    people: '<circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6.4"/><path d="M17.5 14.6A6 6 0 0 1 21 20"/>',
    do: '<path d="M4 4.5h16v15H4z"/><path d="M8 12.2l3 3 5.2-6"/>'
  };
  var LABELS = { compass: "Compass", convictions: "Convictions", plays: "Plays", log: "Log", people: "People", do: "Do" };
  function renderTabs(active) {
    const nav = clear($("#tabs"));
    ROUTES.forEach((r) => {
      const btn = h("button", { class: `tab${r === active ? " active" : ""}`, onClick: () => go(r) });
      btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[r]}</svg><span>${LABELS[r]}</span>`;
      if (r === active) btn.setAttribute("aria-current", "page");
      nav.append(btn);
    });
  }
  var rendering = false;
  function render7() {
    if (!isUnlocked() || rendering) return;
    rendering = true;
    const route = currentRoute();
    const state2 = get();
    const view = clear($("#view"));
    view.append(VIEWS[route].render(state2));
    $("#view-title").textContent = VIEWS[route].title;
    renderTabs(route);
    rendering = false;
  }
  var lastTouch = Date.now();
  var touch = () => {
    lastTouch = Date.now();
  };
  function lockNow() {
    lock();
    closeSheet(true);
    $("#shell").hidden = true;
    clear($("#view"));
    showLock();
  }
  function watchIdle() {
    ["pointerdown", "keydown", "visibilitychange"].forEach((e) => document.addEventListener(e, touch, { passive: true }));
    setInterval(() => {
      if (!isUnlocked() || !isEncrypted()) return;
      const minutes = Number(get().settings.autoLockMinutes || 0);
      if (minutes > 0 && Date.now() - lastTouch > minutes * 6e4) lockNow();
    }, 15e3);
  }
  function showLock() {
    const lock2 = $("#lock");
    lock2.hidden = false;
    $("#lock-error").hidden = true;
    const pin = $("#lock-pin");
    pin.value = "";
    setTimeout(() => pin.focus(), 60);
  }
  function wireLock() {
    $("#lock-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pin = $("#lock-pin").value;
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Checking\u2026";
      const ok = await unlock(pin);
      btn.disabled = false;
      btn.textContent = "Unlock";
      if (!ok) {
        const err = $("#lock-error");
        err.textContent = "That PIN didn't work.";
        err.hidden = false;
        $("#lock-pin").value = "";
        return;
      }
      $("#lock").hidden = true;
      start();
    });
  }
  function start() {
    $("#shell").hidden = false;
    $("#btn-lock").hidden = !isEncrypted();
    touch();
    render7();
    if (!isPersistent()) {
      const warn = $("#warn");
      warn.textContent = "This browser is blocking local storage here, so anything you write will be gone on reload. Open the page in its own tab (or install it) and it will save normally.";
      warn.hidden = false;
    }
  }
  function boot() {
    initSheet();
    wireLock();
    watchIdle();
    onRoute(render7);
    subscribe(() => {
      render7();
      $("#btn-lock").hidden = !isEncrypted();
    });
    $("#btn-settings").addEventListener("click", openSettings);
    $("#btn-lock").addEventListener("click", lockNow);
    if (isEncrypted()) {
      showLock();
    } else {
      open();
      if (!location.hash) location.hash = "#/compass";
      start();
    }
    if ("serviceWorker" in navigator && document.querySelector("link[rel=manifest]")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
        });
      });
    }
  }
  boot();
})();

</script>
