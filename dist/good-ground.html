<style>
/* Good Ground — is this land I could build on? */

:root {
  color-scheme: light dark;

  --paper: #f1efe8;
  --card: #fbfaf6;
  --sunk: #e7e4da;
  --line: #dcd8cc;
  --ink: #1e211c;
  --muted: #6e7268;
  --moss: #3f6d3b;
  --moss-soft: #e0eadb;
  --soil: #7a5a3c;
  --rust: #a8482f;
  --amber: #a97a1e;
  --sky: #40708a;

  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --tap: 44px;
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141714;
    --card: #1b1f1b;
    --sunk: #232823;
    --line: #2e342e;
    --ink: #e9ece3;
    --muted: #969c90;
    --moss: #8ab473;
    --moss-soft: #24301f;
    --soil: #b08a63;
    --rust: #d3775c;
    --amber: #d3a55e;
    --sky: #7fa9c0;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.55 var(--sans);
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.2; margin: 0 0 .35em; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .7em; }
a { color: var(--moss); }
strong { font-weight: 600; }

.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tiny { font-size: .76rem; }
.tnum { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[hidden] { display: none !important; }

.eyebrow {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .09em;
  font-weight: 600; color: var(--muted);
}

/* ---------- shell ---------- */

.shell { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 12px) 18px 12px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.topbar-title { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 1.05rem; }
.topbar-actions { display: flex; gap: 6px; }
.mark { width: 20px; height: 20px; }

.view {
  flex: 1;
  width: 100%; max-width: 720px; margin: 0 auto;
  padding: 20px 18px calc(104px + env(safe-area-inset-bottom));
  outline: none;
}

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
  background: var(--paper);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1 1 0; max-width: 130px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 5px 2px; min-height: var(--tap);
  background: none; border: 0; color: var(--muted);
  font: inherit; font-size: .68rem; cursor: pointer;
}
.tab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--moss); font-weight: 600; }

.warn {
  max-width: 720px; margin: 12px auto 0; padding: 10px 14px;
  border-left: 3px solid var(--rust); background: var(--sunk);
  font-size: .86rem;
}

/* ---------- the ground drawing ---------- */

.plot { display: block; width: 100%; height: auto; }

.verse {
  margin: 16px 0 0; padding: 0 0 0 14px;
  border-left: 2px solid var(--soil);
  font-family: var(--serif); font-style: italic; color: var(--muted);
}
.verse p { margin: 0; font-size: .95rem; line-height: 1.45; }
.verse cite { display: block; margin-top: 4px; font-style: normal; font-size: .76rem; letter-spacing: .04em; }

/* ---------- surfaces ---------- */

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.card + .card { margin-top: 12px; }
.card-tap {
  display: block; width: 100%; padding: 0; border: 0; background: none;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
}
.card.card-tap { padding: 16px; border: 1px solid var(--line); background: var(--card); }
.card.card-tap:active { background: var(--sunk); }

.verdict { font-family: var(--serif); font-size: 1.2rem; line-height: 1.35; }

.section {
  margin: 26px 0 10px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.section h2 { margin: 0; font-size: 1.05rem; }

/* lists read as rows on paper, not boxes inside boxes */
.rows { display: flex; flex-direction: column; }
.rows > * { padding: 12px 0; border-bottom: 1px solid var(--line); }
.rows > *:last-child { border-bottom: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: var(--tap); padding: 0 18px;
  border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink);
  font: inherit; font-weight: 500; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: #fbfdf9; font-weight: 600; }
.btn.ghost { background: none; }
.btn.danger { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 40%, var(--line)); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .86rem; }

.icon-btn {
  min-height: 34px; padding: 0 11px;
  background: none; border: 1px solid var(--line); border-radius: 8px;
  color: var(--muted); font: inherit; font-size: .8rem; cursor: pointer;
}
.icon-btn:active { background: var(--sunk); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--sunk); border: 1px solid transparent;
  font-size: .76rem; color: var(--muted); white-space: nowrap;
}
.chip.on { background: var(--moss-soft); border-color: color-mix(in srgb, var(--moss) 45%, transparent); color: var(--moss); font-weight: 600; }
button.chip { font: inherit; cursor: pointer; font-size: .76rem; }

.tone-good { color: var(--moss); }
.tone-ok { color: var(--moss); }
.tone-thin { color: var(--amber); }
.tone-bad { color: var(--rust); }
.tone-unknown { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; }

.empty {
  border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 22px 16px; text-align: center; color: var(--muted);
}

.areas { display: flex; flex-direction: column; gap: 12px; }
.area-row { display: block; width: 100%; }
.area-row .bar { margin-top: 6px; }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.grid { border-collapse: collapse; width: 100%; font-size: .85rem; }
table.grid th, table.grid td { padding: 7px 9px; text-align: right; white-space: nowrap; }
table.grid thead th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--line); }
table.grid thead th:first-child, table.grid tbody th { text-align: left; font-weight: 600; color: var(--ink); }
table.grid tbody th { position: sticky; left: 0; background: var(--card); max-width: 9rem; overflow: hidden; text-overflow: ellipsis; }
table.grid tbody tr + tr th, table.grid tbody tr + tr td { border-top: 1px solid var(--line); }
table.grid td.cell-alert { outline: 1px solid var(--rust); outline-offset: -1px; }

/* ---------- forms ---------- */

.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

input[type=text], input[type=password], input[type=date], select, textarea {
  width: 100%; padding: 11px 12px; min-height: var(--tap);
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  font: inherit;
}
input[type=color] { width: 58px; height: 44px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--moss); outline-offset: 1px; }
select { appearance: none; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  flex: 1 1 auto; min-height: 38px; padding: 0 11px;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  color: var(--muted); font: inherit; font-size: .82rem; cursor: pointer;
}
.seg button[aria-pressed=true] { background: var(--moss-soft); border-color: var(--moss); color: var(--moss); font-weight: 600; }

.check { display: flex; gap: 12px; align-items: flex-start; }
.check input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--moss); }

/* ---------- sheet ---------- */

.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(20, 23, 20, .5); }
.sheet-panel {
  position: relative; width: 100%; max-width: 620px;
  max-height: 92vh; display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 14px 14px 0 0;
  animation: rise .16s ease-out;
}
@keyframes rise { from { transform: translateY(12px); opacity: .5; } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font-size: 1.15rem; }
.sheet-body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); overflow: auto; }
@media (min-width: 700px) {
  .sheet { align-items: center; }
  .sheet-panel { border-radius: 14px; max-height: 86vh; }
}

/* ---------- lock ---------- */

.lock { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--paper); padding: 22px; }
.lock-card { width: 100%; max-width: 320px; text-align: center; }
.lock-mark { width: 58px; height: 58px; }
.lock form { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.lock input { text-align: center; letter-spacing: .3em; }

/* ---------- toast ---------- */

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom));
  transform: translateX(-50%); z-index: 70;
  background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 999px; font-size: .86rem;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>

<div id="lock" class="lock" hidden>
  <div class="lock-card">
    <svg class="lock-mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 56 Q50 70 50 92" stroke="#8a6743" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M50 56 Q34 70 24 86" stroke="#8a6743" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M50 56 Q66 70 76 86" stroke="#8a6743" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="10" y="52" width="80" height="8" rx="4" fill="#7a5a3c"/>
        <path d="M50 56 V34" stroke="#4a7a45" stroke-width="8" stroke-linecap="round"/>
        <circle cx="50" cy="26" r="17" fill="#4a7a45"/>
      </svg>
    <h1>Good Ground</h1>
    <p class="muted" id="lock-hint">Enter your PIN to unlock.</p>
    <form id="lock-form" autocomplete="off">
      <input id="lock-pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN"
             autocomplete="current-password">
      <button class="btn primary" type="submit">Unlock</button>
    </form>
    <p class="error" id="lock-error" hidden></p>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <header class="topbar">
    <div class="topbar-title">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 56 Q50 70 50 92" stroke="#8a6743" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M50 56 Q34 70 24 86" stroke="#8a6743" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M50 56 Q66 70 76 86" stroke="#8a6743" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect x="10" y="52" width="80" height="8" rx="4" fill="#7a5a3c"/>
        <path d="M50 56 V34" stroke="#4a7a45" stroke-width="8" stroke-linecap="round"/>
        <circle cx="50" cy="26" r="17" fill="#4a7a45"/>
      </svg>
      <span id="view-title">Good Ground</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-lock" title="Lock now" hidden>Lock</button>
      <button class="icon-btn" id="btn-settings" title="Settings">Settings</button>
    </div>
  </header>

  <p id="warn" class="warn" hidden></p>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" data-close aria-label="Close">Close</button>
